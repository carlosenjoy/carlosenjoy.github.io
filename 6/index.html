<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quest – 6º ano</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(160deg, #fff7e6 0%, #e6f4ff 100%);
    color: #1f2a44; min-height: 100vh;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 2.6rem; text-align: center; margin: 10px 0 4px; }
  .sub { text-align: center; font-size: 1.3rem; margin: 0 0 18px; color: #4a5a7a; }
  .card {
    background: #fff; border-radius: 22px; padding: 26px;
    box-shadow: 0 8px 24px rgba(31,42,68,.12); margin-bottom: 18px;
  }
  .hidden { display: none !important; }
  button {
    font-size: 1.4rem; font-weight: 700; border: none; border-radius: 16px;
    padding: 14px 26px; cursor: pointer; transition: transform .1s;
  }
  button:active { transform: scale(.96); }
  .btn-main { background: #ff8a00; color: #fff; }
  .btn-soft { background: #e8eefc; color: #1f2a44; }
  .btn-ok { background: #18a058; color: #fff; }
  input[type=text] {
    font-size: 1.6rem; padding: 14px 18px; border-radius: 14px;
    border: 3px solid #c9d6f0; width: 100%; outline: none;
  }
  input[type=text]:focus { border-color: #ff8a00; }

  /* Tabuleiro */
  .board { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .sq {
    width: 54px; height: 54px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 700; color: #fff; position: relative;
  }
  .z1 { background: #7cc6fe; } .z2 { background: #8bd17c; } .z3 { background: #f6a85b; }
  .sq.top { background: #f5c400; font-size: 1.6rem; }
  .sq.here { outline: 5px solid #1f2a44; transform: scale(1.18); }
  .sq.here::after { content: "🧑‍🎓"; position: absolute; top: -34px; font-size: 1.8rem; }
  .stats { display: flex; justify-content: space-around; font-size: 1.3rem; margin-top: 30px; flex-wrap: wrap; gap: 8px; }
  .combo { color: #ff8a00; font-weight: 800; }

  /* Pergunta */
  .tema { display: inline-block; background: #e8eefc; border-radius: 10px; padding: 4px 12px; font-size: 1.05rem; margin-bottom: 10px; }
  .q { font-size: 2rem; font-weight: 700; margin: 8px 0 20px; line-height: 1.35; }
  .text-box { font-size: 1.5rem; background: #fff7e6; border-left: 8px solid #ff8a00; padding: 14px 18px; border-radius: 12px; margin-bottom: 16px; line-height: 1.5; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .opt { font-size: 1.7rem; background: #e8eefc; color: #1f2a44; padding: 20px; }
  .opt.right { background: #18a058; color: #fff; }
  .opt.wrong { background: #e5484d; color: #fff; }
  .row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; align-items: center; }

  .line {
    min-height: 74px; border: 3px dashed #c9d6f0; border-radius: 14px;
    padding: 10px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px;
  }
  .chip { font-size: 1.6rem; background: #ffe2b8; color: #1f2a44; padding: 10px 18px; }
  .chip.used { visibility: hidden; }

  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .mcard {
    height: 96px; font-size: 1.6rem; background: #6c8cff; color: #fff;
    display: flex; align-items: center; justify-content: center; border-radius: 16px; cursor: pointer;
  }
  .mcard.open { background: #fff7e6; color: #1f2a44; border: 3px solid #ff8a00; }
  .mcard.done { background: #18a058; color: #fff; cursor: default; }

  .fb { font-size: 1.6rem; font-weight: 700; padding: 16px; border-radius: 14px; margin-top: 18px; }
  .fb.good { background: #dcf5e6; color: #0e6b3a; }
  .fb.bad { background: #fde4e4; color: #9b1c1f; }
  .fb small { display: block; font-weight: 500; font-size: 1.25rem; margin-top: 6px; color: #1f2a44; }

  .big-emoji { font-size: 5rem; text-align: center; }
  table { width: 100%; border-collapse: collapse; font-size: 1.3rem; }
  td, th { padding: 10px; border-bottom: 2px solid #e8eefc; text-align: left; }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <!-- TELA INICIAL -->
  <div id="start" class="card center">
    <div class="big-emoji">🗺️</div>
    <h1>English Quest</h1>
    <p class="sub">Acerte e avance no tabuleiro. Chegue ao 🏆!</p>
    <p style="font-size:1.4rem">Qual é o seu nome?</p>
    <input type="text" id="nome" placeholder="Digite seu nome" maxlength="30">
    <div class="row" style="justify-content:center">
      <button class="btn-main" onclick="startGame()">Começar ▶</button>
    </div>
  </div>

  <!-- JOGO -->
  <div id="game" class="hidden">
    <div class="card">
      <div class="board" id="board"></div>
      <div class="stats">
        <span>👤 <b id="sNome"></b></span>
        <span>✅ <b id="sOk">0</b></span>
        <span>⭐ Pontos: <b id="sPts">0</b></span>
        <span id="sCombo" class="combo"></span>
      </div>
    </div>
    <div class="card" id="qcard"></div>
  </div>

  <!-- FIM -->
  <div id="end" class="card hidden center"></div>

</div>

<script>
/* =========================================================
   BANCO DE QUESTÕES
   zona 1 = casas 1-5 | zona 2 = casas 6-10 | zona 3 = casas 11-15
   Tipos: choice, write, translate, order, memory, read
   ========================================================= */
const BANK = {
  1: [
    {t:'choice', tema:'Pronomes', q:'👧 A menina → qual pronome?', opts:['He','She','It'], a:'She', dica:'Menina = SHE (ela).', say:'She'},
    {t:'choice', tema:'Pronomes', q:'👦 O menino → qual pronome?', opts:['She','They','He'], a:'He', dica:'Menino = HE (ele).', say:'He'},
    {t:'choice', tema:'Pronomes', q:'🐶 O cachorro → qual pronome?', opts:['It','He','We'], a:'It', dica:'Animais e coisas = IT.', say:'It'},
    {t:'choice', tema:'Pronomes', q:'🙋‍♂️🙋‍♀️ Eu e meus amigos → qual pronome?', opts:['They','We','You'], a:'We', dica:'Eu + outras pessoas = WE (nós).', say:'We'},
    {t:'choice', tema:'Pronomes', q:'👫 Os amigos (sem mim) → qual pronome?', opts:['We','They','I'], a:'They', dica:'Eles / elas = THEY.', say:'They'},
    {t:'choice', tema:'Verbo to be', q:'I ___ a student.', opts:['am','is','are'], a:'am', dica:'Com I usamos sempre AM.', say:'I am a student.'},
    {t:'choice', tema:'Verbo to be', q:'You ___ my friend.', opts:['is','am','are'], a:'are', dica:'Com YOU usamos ARE.', say:'You are my friend.'},
    {t:'choice', tema:'Verbo to be', q:'He ___ ten years old.', opts:['are','is','am'], a:'is', dica:'Com HE, SHE e IT usamos IS.', say:'He is ten years old.'},
    {t:'write', tema:'Verbo to be', q:'Complete: I ___ happy. 😊', a:['am'], dica:'I + AM.', say:'I am happy.'},
    {t:'write', tema:'Verbo to be', q:'Complete: She ___ nice. 🌸', a:['is'], dica:'She + IS.', say:'She is nice.'},
    {t:'memory', tema:'Pronomes', pairs:[['I','Eu'],['You','Você'],['He','Ele'],['She','Ela']]},
    {t:'memory', tema:'Pronomes', pairs:[['We','Nós'],['They','Eles'],['It','🐶 / 📦'],['I','Eu']]}
  ],
  2: [
    {t:'order', tema:'Frases', words:['is','He','tall'], a:'He is tall', dica:'Pessoa + verbo + característica.', say:'He is tall.'},
    {t:'order', tema:'Frases', words:['my','are','They','friends'], a:'They are my friends', dica:'They + are + my friends.', say:'They are my friends.'},
    {t:'translate', tema:'Tradução', q:'Traduza: Eu sou estudante.', a:['i am a student','i am student'], dica:'I am a student.', say:'I am a student.'},
    {t:'translate', tema:'Tradução', q:'Traduza: Nós somos amigos.', a:['we are friends'], dica:'We are friends.', say:'We are friends.'},
    {t:'translate', tema:'Tradução', q:'Traduza: Ela é bonita.', a:['she is beautiful','she is pretty'], dica:'She is beautiful.', say:'She is beautiful.'},
    {t:'translate', tema:'Tradução', q:'Traduza: O cachorro é pequeno. 🐕', a:['the dog is small','the dog is little'], dica:'The dog is small.', say:'The dog is small.'},
    {t:'choice', tema:'Negativa', q:'She ___ sad. (negativa: ela NÃO está triste)', opts:["isn't","aren't","am not"], a:"isn't", dica:"is + not = ISN'T.", say:"She isn't sad."},
    {t:'choice', tema:'Pergunta', q:'___ you from Brazil? 🇧🇷', opts:['Is','Are','Am'], a:'Are', dica:'Na pergunta, o verbo vem antes: ARE you...?', say:'Are you from Brazil?'},
    {t:'write', tema:'Verbo to be', q:'Complete: They ___ at school. 🏫', a:['are'], dica:'They + ARE.', say:'They are at school.'},
    {t:'choice', tema:'Negativa', q:'We ___ not tired.', opts:['is','am','are'], a:'are', dica:'We + ARE (+ not).', say:'We are not tired.'}
  ],
  3: [
    {t:'choice', tema:'Resposta curta', q:'Is he your brother? — Yes, he ___.', opts:['is','are',"isn't"], a:'is', dica:'Resposta curta repete o verbo: Yes, he IS.', say:'Is he your brother? Yes, he is.'},
    {t:'choice', tema:'Resposta curta', q:'Are they from Guarulhos? — No, they ___.', opts:["isn't","aren't",'are'], a:"aren't", dica:"No + they AREN'T.", say:"Are they from Guarulhos? No, they aren't."},
    {t:'translate', tema:'Tradução', q:'Traduza: Você é do Brasil?', a:['are you from brazil'], dica:'Are you from Brazil?', say:'Are you from Brazil?'},
    {t:'translate', tema:'Tradução', q:'Traduza: Eles não estão na escola.', a:['they are not at school','they are not in school','they are not at the school'], dica:"They aren't at school.", say:"They aren't at school."},
    {t:'translate', tema:'Tradução', q:'Traduza: Qual é o seu nome?', a:['what is your name'], dica:"What's your name?", say:"What's your name?"},
    {t:'order', tema:'Frases', words:['you','are','Where','from'], a:'Where are you from', dica:'Where + are + you + from?', say:'Where are you from?'},
    {t:'order', tema:'Frases', words:['teacher','mother','My','a','is'], a:'My mother is a teacher', dica:'My mother is a teacher.', say:'My mother is a teacher.'},
    {t:'write', tema:'Desafio', q:'Em inglês, idade usa o verbo to be!\nI ___ 12 years old.', a:['am'], dica:'Em português "tenho 12 anos", em inglês "I AM 12".', say:'I am twelve years old.'},
    {t:'read', tema:'Leitura', text:"Hi! I'm Ana. I am 11 years old. I am from Guarulhos. Leo is my brother. He is 8.", q:'How old is Ana?', opts:['8','11','12'], a:'11', dica:'"I am 11 years old."', say:"Hi! I'm Ana. I am 11 years old."},
    {t:'read', tema:'Leitura', text:"Hi! I'm Ana. I am 11 years old. I am from Guarulhos. Leo is my brother. He is 8.", q:'Who is Leo?', opts:["Ana's brother","Ana's friend","Ana's father"], a:"Ana's brother", dica:'"Leo is my brother."', say:'Leo is my brother.'},
    {t:'memory', tema:'Contrações', pairs:[["I am","I'm"],["You are","You're"],["He is","He's"],["They are","They're"]]}
  ]
};

/* ========================================================= */
const TOTAL = 15, START = 3;
let S = {};

function zoneOf(p){ return p <= 5 ? 1 : (p <= 10 ? 2 : 3); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const $ = id => document.getElementById(id);

const CONTR = {"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","isn't":"is not","aren't":"are not","what's":"what is","where's":"where is"};
function norm(s){
  s = s.toLowerCase().replace(/[’`´]/g,"'").replace(/[.,!?;:]/g,' ').replace(/\s+/g,' ').trim();
  return s.split(' ').map(w => CONTR[w] || w).join(' ');
}

function speak(txt){
  try{
    const u = new SpeechSynthesisUtterance(txt); u.lang = 'en-US'; u.rate = .85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }catch(e){}
}

function startGame(){
  const n = $('nome').value.trim();
  if(!n){ $('nome').focus(); return; }
  S = { nome:n, pos:START, ok:0, err:0, pts:0, streak:0, max:START, used:{1:[],2:[],3:[]}, temas:{} };
  $('start').classList.add('hidden'); $('end').classList.add('hidden'); $('game').classList.remove('hidden');
  $('sNome').textContent = n;
  render(); nextQ();
}

function render(){
  let h = '';
  for(let i=1;i<=TOTAL;i++){
    const cls = i===TOTAL ? 'sq top' : 'sq z'+zoneOf(i);
    h += `<div class="${cls}${i===S.pos?' here':''}">${i===TOTAL?'🏆':i}</div>`;
  }
  $('board').innerHTML = h;
  $('sOk').textContent = S.ok; $('sPts').textContent = S.pts;
  $('sCombo').textContent = S.streak >= 2 ? '🔥 Combo x'+S.streak : '';
}

function pick(z){
  let pool = BANK[z].map((q,i)=>i).filter(i => !S.used[z].includes(i));
  if(!pool.length){ S.used[z] = []; pool = BANK[z].map((q,i)=>i); }
  const i = pool[Math.floor(Math.random()*pool.length)];
  S.used[z].push(i);
  return BANK[z][i];
}

function nextQ(){
  const z = zoneOf(S.pos);
  const q = pick(z); S.cur = q; S.answered = false;
  const c = $('qcard');
  let h = `<span class="tema">${q.tema}</span>`;
  if(z === 3) h += ` <span class="tema" style="background:#ffe2b8">💪 Puxa Mais</span>`;

  if(q.t === 'choice' || q.t === 'read'){
    if(q.t === 'read') h += `<div class="text-box">${q.text} <button class="btn-soft" style="font-size:1rem;padding:6px 12px" onclick="speak(S.cur.text)">🔊</button></div>`;
    h += `<div class="q">${q.q}</div><div class="opts">`;
    shuffle(q.opts).forEach(o => { h += `<button class="opt" onclick="checkChoice(this)">${o}</button>`; });
    h += `</div>`;
  }
  else if(q.t === 'write' || q.t === 'translate'){
    h += `<div class="q">${q.q.replace(/\n/g,'<br>')}</div>
      <input type="text" id="ans" placeholder="Escreva aqui..." autocomplete="off" onkeydown="if(event.key==='Enter')checkText()">
      <div class="row"><button class="btn-ok" onclick="checkText()">Conferir ✔</button></div>`;
  }
  else if(q.t === 'order'){
    S.built = [];
    h += `<div class="q">Monte a frase:</div><div class="line" id="line"></div><div class="row" id="chips">`;
    shuffle(q.words).forEach((w,i) => { h += `<button class="chip" id="ch${i}" onclick="addChip(${i},'${w.replace(/'/g,"\\'")}')">${w}</button>`; });
    h += `</div><div class="row"><button class="btn-soft" onclick="resetOrder()">↺ Limpar</button><button class="btn-ok" onclick="checkOrder()">Conferir ✔</button></div>`;
  }
  else if(q.t === 'memory'){
    S.mem = { open:[], done:0, miss:0, lock:false };
    let cards = [];
    q.pairs.forEach((p,i) => { cards.push({v:p[0],k:i}); cards.push({v:p[1],k:i}); });
    cards = shuffle(cards); S.memCards = cards;
    h += `<div class="q">Jogo da memória: encontre os pares! 🧠</div><div class="mem">`;
    cards.forEach((cd,i) => { h += `<div class="mcard" id="m${i}" onclick="flip(${i})">?</div>`; });
    h += `</div>`;
  }
  h += `<div id="fb"></div>`;
  c.innerHTML = h;
  const a = $('ans'); if(a) a.focus();
}

/* ---- conferências ---- */
function checkChoice(btn){
  if(S.answered) return;
  const ok = btn.textContent === S.cur.a;
  document.querySelectorAll('.opt').forEach(b => { if(b.textContent === S.cur.a) b.classList.add('right'); });
  if(!ok) btn.classList.add('wrong');
  result(ok);
}
function checkText(){
  if(S.answered) return;
  const v = $('ans').value; if(!v.trim()) return;
  const ok = S.cur.a.some(x => norm(x) === norm(v));
  $('ans').disabled = true;
  result(ok);
}
function addChip(i,w){ if(S.answered) return; S.built.push({i,w}); $('ch'+i).classList.add('used'); drawLine(); }
function drawLine(){ $('line').innerHTML = S.built.map(b => `<button class="chip">${b.w}</button>`).join(''); }
function resetOrder(){ if(S.answered) return; S.built = []; document.querySelectorAll('.chip.used').forEach(c=>c.classList.remove('used')); drawLine(); }
function checkOrder(){
  if(S.answered || !S.built.length) return;
  result(norm(S.built.map(b=>b.w).join(' ')) === norm(S.cur.a));
}
function flip(i){
  const m = S.mem; const el = $('m'+i);
  if(m.lock || el.classList.contains('open') || el.classList.contains('done')) return;
  el.classList.add('open'); el.textContent = S.memCards[i].v;
  m.open.push(i);
  if(m.open.length === 2){
    const [a,b] = m.open; m.lock = true;
    if(S.memCards[a].k === S.memCards[b].k){
      setTimeout(()=>{ $('m'+a).className='mcard done'; $('m'+b).className='mcard done'; m.open=[]; m.lock=false; m.done++;
        if(m.done === S.cur.pairs.length) result(m.miss <= 5, true); }, 400);
    } else {
      m.miss++;
      setTimeout(()=>{ [a,b].forEach(x=>{ $('m'+x).className='mcard'; $('m'+x).textContent='?'; }); m.open=[]; m.lock=false; }, 900);
    }
  }
}

/* ---- movimento no tabuleiro ---- */
function result(ok, isMem){
  S.answered = true;
  const q = S.cur;
  S.temas[q.tema] = S.temas[q.tema] || {ok:0, err:0};
  let msg, cls, extra = '';
  if(ok){
    S.ok++; S.streak++; S.temas[q.tema].ok++;
    let step = 1; S.pts += 10 * zoneOf(S.pos);
    if(S.streak % 3 === 0){ step = 2; extra = ' 🔥 Combo! Avança 2 casas!'; }
    S.pos = Math.min(TOTAL, S.pos + step);
    msg = ['Great job! 🎉','Excellent! ⭐','Well done! 👏','Awesome! 🚀'][Math.floor(Math.random()*4)] + extra;
    cls = 'good';
  } else {
    S.err++; S.streak = 0; S.temas[q.tema].err++;
    if(S.pos > 1) S.pos -= 1;
    msg = 'Quase! Volta 1 casa para treinar mais. 💙'; cls = 'bad';
  }
  S.max = Math.max(S.max, S.pos);
  const dica = isMem ? (ok ? 'Memória afiada!' : 'Muitas tentativas — vamos treinar de novo.') :
    (ok ? (q.dica || '') : 'Resposta: <b>' + (q.a instanceof Array ? q.a[0] : q.a) + '</b><br>' + (q.dica || ''));
  let h = `<div class="fb ${cls}">${msg}<small>${dica}</small></div><div class="row">`;
  if(q.say) h += `<button class="btn-soft" onclick="speak(S.cur.say)">🔊 Ouvir</button>`;
  h += S.pos === TOTAL ? `<button class="btn-main" onclick="finish()">🏆 Ver resultado</button>`
                       : `<button class="btn-main" onclick="nextQ()">Próxima ▶</button>`;
  h += `</div>`;
  $('fb').innerHTML = h;
  if(ok && q.say) speak(q.say);
  render();
}

function finish(){
  $('game').classList.add('hidden');
  let rows = Object.entries(S.temas).map(([t,v]) => `<tr><td>${t}</td><td>${v.ok}</td><td>${v.err}</td></tr>`).join('');
  $('end').innerHTML = `
    <div class="big-emoji">🏆</div>
    <h1>Congratulations, ${S.nome}!</h1>
    <p class="sub">Você chegou ao topo do tabuleiro!</p>
    <p style="font-size:1.5rem">✅ Acertos: <b>${S.ok}</b> &nbsp; 🔁 Treinos: <b>${S.err}</b> &nbsp; ⭐ Pontos: <b>${S.pts}</b></p>
    <table><tr><th>Tema</th><th>Acertos</th><th>Treinos</th></tr>${rows}</table>
    <p style="font-size:1.1rem;color:#4a5a7a">📸 Mostre esta tela ao professor.</p>
    <div class="row" style="justify-content:center"><button class="btn-main" onclick="startGame()">Jogar de novo ↺</button></div>`;
  $('end').classList.remove('hidden');
  speak('Congratulations, ' + S.nome + '!');
}
</script>
</body>
</html>
